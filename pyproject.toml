[project]
name = "dont-serve-together"
version = "0.1.0"
description = "GUI manager for Don't Starve Together dedicated-server clusters, mods, and settings."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "textual>=8.2.8",
    "textual-diff-view>=0.1.5",
    "textual-fspicker>=1.0.1",
]

[project.scripts]
dont-serve-together = "dont_serve_together.__main__:main"

[dependency-groups]
dev = [
    "pillow",
    "pyinstaller",
    "pyright",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dont_serve_together"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
force-wrap-aliases = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
