[project]
name = "dont-serve-together"
version = "0.1.0"
description = "GUI manager for Don't Starve Together dedicated-server clusters, mods, and settings."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "textual>=8.2.8",
    "textual-diff-view>=0.1.5",
    "textual-fspicker>=1.0.1",
]

[project.scripts]
dont_serve_together = "dont_serve_together.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller",
    "pyright",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dont_serve_together"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# pycodestyle/pyflakes, isort, naming, pyupgrade, bugbear, simplify, pathlib,
# pydocstyle, and annotation checks -- matching the project's coding conventions.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH", "D", "ANN", "RUF"]
ignore = [
    "D203",  # incompatible with D211 (no blank line before class docstring)
    "D213",  # incompatible with D212 (multi-line summary on first line)
    "ANN401",  # allow explicit typing.Any where genuinely needed
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests don't need docstrings or full annotations.
"tests/**" = ["D", "ANN"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["dont_serve_together", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
